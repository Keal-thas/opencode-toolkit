name: lsp-tests

# java-lsp and spring-lsp drive a real language server, so their tests need a
# JDK 21+ and (for jdtls's launcher) Python 3, which the docker/ sandbox image
# doesn't have (see mcp-servers/TODO.md). They run here instead, on Linux and
# on Windows, where the extraction and launcher paths differ. `shell: bash`
# is Git Bash on the Windows runner, the same shell the target machine uses.
on:
  pull_request:
    paths:
      - "mcp-servers/java-lsp/**"
      - "mcp-servers/spring-lsp/**"
      - ".github/workflows/lsp-tests.yml"
  push:
    branches: [master]
    paths:
      - "mcp-servers/java-lsp/**"
      - "mcp-servers/spring-lsp/**"
      - ".github/workflows/lsp-tests.yml"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [java-lsp, spring-lsp]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: mcp-servers/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: npm test
