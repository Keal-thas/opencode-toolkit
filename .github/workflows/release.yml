name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # for npm trusted publishing (OIDC) - see CLAUDE.md's "Whole-repo npm publish" entry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, including .git)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: |
          # Trusted publishing needs npm >= 11.5.1. Node 24 already bundles
          # a new enough npm (confirmed 2026-09-24: v24.21.0 ships 11.19.0),
          # so no separate `npm install -g npm@latest` upgrade step is needed.
          npm --version
          VERSION="${GITHUB_REF_NAME#v}"
          # Every npm package in this repo shares this one version number -
          # none of their committed package.json version fields are the
          # source of truth, this tag is (see CLAUDE.md's "Whole-repo npm
          # publish" entry). The "already published?" check makes a
          # workflow re-run for the same tag safe (e.g. after the release
          # step below fails transiently).
          for dir in . plugins/hook-logger plugins/llm-review-gate plugins/system-prompt-tools mcp-servers/oracle mcp-servers/loki mcp-servers/java-lsp mcp-servers/spring-lsp mcp-servers/mysql; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already published, skipping"
              continue
            fi
            # A package with a "build" script publishes compiled output
            # (e.g. mcp-servers/oracle's dist/, see its package.json's
            # "files" field), not its TypeScript source directly - build it
            # before packing the tarball. Packages with no "build" script
            # (plain JS/loaded-as-TS, everything else here) skip this.
            if node -e "process.exit(require('./$dir/package.json').scripts?.build ? 0 : 1)"; then
              echo "Building $name"
              (cd "$dir" && npm ci && npm run build)
            fi
            echo "Publishing $name@$VERSION"
            (cd "$dir" && npm pkg set version="$VERSION" && npm publish --access public)
          done

      - name: Build zip with .git included
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          tag="${GITHUB_REF_NAME}"
          out="${repo}-${tag}-with-git.zip"
          zip -r "$out" . -x "$out"
          echo "ASSET_PATH=$out" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$out" >> "$GITHUB_ENV"

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
