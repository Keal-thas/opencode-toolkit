# Shared machine-wide fixture: one Oracle for every worktree (a single instance uses ~2 GiB RAM), so it lives in its own fixed-name project, started separately - not by dev.sh.
name: opencode-toolkit-oracle

services:
  oracle:
    image: gvenzl/oracle-free:${ORACLE_FREE_VERSION:?set ORACLE_FREE_VERSION in .env}
    container_name: opencode-toolkit-oracle-test
    ports:
      # Host debugging only.
      - "127.0.0.1:1521:1521"
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - ORACLE_PASSWORD=${ORACLE_SYS_PASSWORD:?set ORACLE_SYS_PASSWORD in .env}
      - APP_USER=${ORACLE_APP_USER:?set ORACLE_APP_USER in .env}
      - APP_USER_PASSWORD=${ORACLE_APP_USER_PASSWORD:?set ORACLE_APP_USER_PASSWORD in .env}
      - ORACLE_MEMORY=1G
      - _SGA_TARGET=512M
      - _PGA_AGGREGATE_TARGET=128M
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  oracle-data:
    name: opencode-toolkit-oracle-data

networks:
  oracle-net:
    name: opencode-toolkit-oracle-net
