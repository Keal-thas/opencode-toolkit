# Shared machine-wide fixture, same singleton rationale as oracle (fixed-name project, started separately).
name: opencode-toolkit-loki

services:
  # No HEALTHCHECK: grafana/loki is built FROM distroless (no shell/wget/curl inside), so there's nothing to exec a healthcheck command with.
  loki:
    image: grafana/loki:${LOKI_VERSION:?set LOKI_VERSION in .env}
    container_name: opencode-toolkit-loki-test
    ports:
      # Host debugging only.
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - loki-net

volumes:
  loki-data:
    name: opencode-toolkit-loki-data

networks:
  loki-net:
    name: opencode-toolkit-loki-net
