# Throwaway sandbox fixture, not a real secret - see docker/docker-notes.md's
# "Redis test instance" section. Loaded at startup instead of a runtime `ACL
# SETUSER` call so the readonlyuser account survives a container restart
# without re-running anything (Redis's in-memory ACL state otherwise resets).

# Left open (no password) for ad-hoc redis-cli debugging inside this docker
# network - the port is host-bound to 127.0.0.1 besides that, same exposure
# as oracle/loki/mysql's sandbox fixtures.
user default on nopass ~* &* +@all

# The account mcp-servers/redis/'s redis-mcp-server actually connects as in
# the sandbox. +@read -@write mirrors mcp-servers/redis/README.md's ACL
# recommendation, verified against this exact ruleset: GET/KEYS allowed,
# SET/DEL/FLUSHALL/EVAL/SORT..STORE all denied with NOPERM.
user readonlyuser on >readonlypass ~* +@read -@write
