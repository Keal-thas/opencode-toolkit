# No top-level `name:` on purpose - dev.sh sets COMPOSE_PROJECT_NAME (hashed from the worktree path) so concurrent worktrees never collide. Launch via docker/dev.sh only.
services:
  opencode-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        OPENCODE_VERSION: "${OPENCODE_VERSION:?set OPENCODE_VERSION in .env}"
    # Fixed image tag (shared across worktrees - multi-GB toolchain), but no fixed container_name: Compose derives it from the hashed project so each worktree gets its own. Race risk if two worktrees build concurrently with different Dockerfile content - accepted.
    image: opencode-toolkit-dev:latest
    working_dir: /home/dev/project
    volumes:
      - ..:/home/dev/project
      - ${HOME}/.keys/.deepseek-key:/home/dev/.keys/.deepseek-key:ro
    # No opencode config/data named volumes - they live in the container's writable layer and reset on every --rm; docker-entrypoint.sh regenerates opencode.jsonc each start.
    environment:
      - DEEPSEEK_API_KEY
      - ORACLE_CONNECT_STRING=oracle:1521/FREEPDB1
      - ORACLE_USER=${ORACLE_APP_USER:?set ORACLE_APP_USER in .env}
      - ORACLE_PASSWORD=${ORACLE_APP_USER_PASSWORD:?set ORACLE_APP_USER_PASSWORD in .env}
      - LOKI_BASE_URL=http://loki:3100
    networks:
      - default
      - oracle-net
      - loki-net
    # No depends_on oracle/loki - it can't reach across compose projects; start them separately (see docker-notes.md).
    stdin_open: true
    tty: true
    command: bash

networks:
  oracle-net:
    name: opencode-toolkit-oracle-net
    external: true
  loki-net:
    name: opencode-toolkit-loki-net
    external: true
